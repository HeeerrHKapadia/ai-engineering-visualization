<svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="mIndigo" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4f46e5"/></marker>
    <marker id="mGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/></marker>
    <marker id="mAmber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d97706"/></marker>
    <filter id="softM" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="0" y="0" width="1280" height="680" fill="#f8fafc"/>

  <text x="640" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">How "similar" gets measured</text>
  <text x="640" y="72" text-anchor="middle" font-size="15" fill="#475569">Three metrics, one question: how close are these two vectors?</text>

  <!-- ============ ① COSINE ============ -->
  <rect x="60" y="110" width="380" height="390" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softM)"/>
  <rect x="84" y="132" width="150" height="26" rx="13" fill="#4f46e5"/>
  <text x="159" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">① COSINE SIMILARITY</text>
  <text x="84" y="184" font-size="14.5" font-weight="700" fill="#3730a3">The angle between them</text>

  <line x1="150" y1="380" x2="320" y2="230" stroke="#4f46e5" stroke-width="3" marker-end="url(#mIndigo)"/>
  <line x1="150" y1="380" x2="360" y2="300" stroke="#4f46e5" stroke-width="3" marker-end="url(#mIndigo)"/>
  <path d="M 201 360 A 55 55 0 0 0 191 344" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <text x="216" y="352" font-size="15" font-weight="700" fill="#b45309">θ</text>
  <text x="332" y="224" font-size="14" font-weight="700" fill="#3730a3">A</text>
  <text x="374" y="296" font-size="14" font-weight="700" fill="#3730a3">B</text>
  <circle cx="150" cy="380" r="4" fill="#334155"/>

  <text x="84" y="434" font-size="13.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 = same · 0 = unrelated · −1 = opposite</text>
  <text x="84" y="460" font-size="13.5" fill="#475569">Ignores length entirely — only the angle counts.</text>
  <text x="84" y="484" font-size="12.5" fill="#64748b" font-style="italic">The default in most vector databases.</text>

  <!-- ============ ② DOT PRODUCT ============ -->
  <rect x="450" y="110" width="380" height="390" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softM)"/>
  <rect x="474" y="132" width="132" height="26" rx="13" fill="#059669"/>
  <text x="540" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">② DOT PRODUCT</text>
  <text x="474" y="184" font-size="14.5" font-weight="700" fill="#065f46">Angle <tspan font-style="italic">and</tspan> length</text>

  <line x1="540" y1="380" x2="680" y2="256" stroke="#059669" stroke-width="3" marker-end="url(#mGreen)"/>
  <line x1="540" y1="380" x2="770" y2="292" stroke="#059669" stroke-width="3" marker-end="url(#mGreen)"/>
  <path d="M 591 360 A 55 55 0 0 0 578 341" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <text x="604" y="350" font-size="15" font-weight="700" fill="#b45309">θ</text>
  <text x="692" y="250" font-size="14" font-weight="700" fill="#065f46">A</text>
  <text x="784" y="288" font-size="14" font-weight="700" fill="#065f46">B</text>
  <text x="700" y="336" font-size="12" fill="#94a3b8" font-style="italic">longer vector</text>
  <circle cx="540" cy="380" r="4" fill="#334155"/>

  <text x="474" y="434" font-size="13.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">A · B = |A| |B| cos θ</text>
  <text x="474" y="460" font-size="13.5" fill="#475569">A longer vector scores higher at the same angle.</text>
  <text x="474" y="484" font-size="12.5" fill="#64748b" font-style="italic">Cheapest to compute — no division.</text>

  <!-- ============ ③ EUCLIDEAN ============ -->
  <rect x="840" y="110" width="380" height="390" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softM)"/>
  <rect x="864" y="132" width="168" height="26" rx="13" fill="#d97706"/>
  <text x="948" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">③ EUCLIDEAN DISTANCE</text>
  <text x="864" y="184" font-size="14.5" font-weight="700" fill="#92400e">Straight-line gap</text>

  <line x1="930" y1="380" x2="1050" y2="248" stroke="#d97706" stroke-width="3" marker-end="url(#mAmber)"/>
  <line x1="930" y1="380" x2="1150" y2="308" stroke="#d97706" stroke-width="3" marker-end="url(#mAmber)"/>
  <line x1="1054" y1="252" x2="1146" y2="304" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="1118" y="262" font-size="15" font-weight="700" fill="#dc2626">d</text>
  <text x="1062" y="242" font-size="14" font-weight="700" fill="#92400e">A</text>
  <text x="1164" y="304" font-size="14" font-weight="700" fill="#92400e">B</text>
  <circle cx="930" cy="380" r="4" fill="#334155"/>

  <text x="864" y="434" font-size="13.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">d = √ Σ (aᵢ − bᵢ)²</text>
  <text x="864" y="460" font-size="13.5" fill="#475569">Measures the gap between the two tips.</text>
  <text x="864" y="484" font-size="12.5" fill="#64748b" font-style="italic">Lower is better here — it is a distance, not a score.</text>

  <!-- ============ practical strip ============ -->
  <rect x="60" y="524" width="1160" height="106" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="556" font-size="16" font-weight="700" fill="#0f172a">In practice, this choice matters less than it looks</text>
  <text x="84" y="584" font-size="13.5" fill="#334155">Most embedding APIs already return <tspan font-weight="700">unit-length</tspan> vectors. Once every vector has length 1, all three metrics rank results in the <tspan font-weight="700">same order</tspan> —</text>
  <text x="84" y="608" font-size="13.5" fill="#334155">so your top-K comes out identical. Take whatever your vector DB defaults to (usually cosine) and spend the effort on chunking and reranking instead.</text>

  <text x="640" y="662" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">If you are not sure whether your vectors are normalized, check: the dot product of a vector with itself should be 1.</text>
</svg>
