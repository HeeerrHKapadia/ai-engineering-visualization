<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="sIndigo" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4f46e5"/></marker>
    <marker id="sGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/></marker>
    <filter id="softS" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#f8fafc"/>

  <text x="640" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">The embedding space — where meaning becomes geometry</text>
  <text x="640" y="72" text-anchor="middle" font-size="15" fill="#475569">Similar meanings land near each other, and the direction between points carries meaning of its own</text>

  <!-- ============ LEFT PANEL: clusters ============ -->
  <rect x="60" y="106" width="730" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softS)"/>
  <text x="84" y="136" font-size="13" fill="#94a3b8">embedding space (1536 real dimensions — flattened to two here)</text>

  <!-- Animals -->
  <ellipse cx="250" cy="290" rx="145" ry="100" fill="#eef2ff" opacity="0.75"/>
  <text x="250" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">Animals</text>
  <circle cx="195" cy="255" r="9" fill="#6366f1"/><text x="195" y="239" text-anchor="middle" font-size="12.5" fill="#3730a3">dog</text>
  <circle cx="285" cy="245" r="9" fill="#6366f1"/><text x="285" y="229" text-anchor="middle" font-size="12.5" fill="#3730a3">cat</text>
  <circle cx="210" cy="330" r="9" fill="#6366f1"/><text x="210" y="314" text-anchor="middle" font-size="12.5" fill="#3730a3">puppy</text>
  <circle cx="305" cy="325" r="9" fill="#6366f1"/><text x="305" y="309" text-anchor="middle" font-size="12.5" fill="#3730a3">kitten</text>

  <!-- Finance -->
  <ellipse cx="610" cy="270" rx="140" ry="95" fill="#ecfdf5" opacity="0.75"/>
  <text x="610" y="163" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Finance</text>
  <circle cx="565" cy="235" r="9" fill="#059669"/><text x="565" y="219" text-anchor="middle" font-size="12.5" fill="#065f46">revenue</text>
  <circle cx="660" cy="250" r="9" fill="#059669"/><text x="660" y="234" text-anchor="middle" font-size="12.5" fill="#065f46">profit</text>
  <circle cx="600" cy="315" r="9" fill="#059669"/><text x="600" y="299" text-anchor="middle" font-size="12.5" fill="#065f46">earnings</text>

  <!-- Programming -->
  <ellipse cx="420" cy="505" rx="155" ry="82" fill="#fae8ff" opacity="0.75"/>
  <text x="420" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#86198f">Programming</text>
  <circle cx="360" cy="480" r="9" fill="#c026d3"/><text x="360" y="464" text-anchor="middle" font-size="12.5" fill="#86198f">python</text>
  <circle cx="475" cy="475" r="9" fill="#c026d3"/><text x="475" y="459" text-anchor="middle" font-size="12.5" fill="#86198f">compiler</text>
  <circle cx="400" cy="540" r="9" fill="#c026d3"/><text x="400" y="524" text-anchor="middle" font-size="12.5" fill="#86198f">javascript</text>

  <!-- distance annotations -->
  <line x1="294" y1="248" x2="556" y2="236" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="393" y="209" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b">far apart — unrelated meanings</text>

  <line x1="290" y1="254" x2="302" y2="316" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="345" y="292" font-size="12.5" font-weight="600" fill="#b45309">near</text>

  <text x="425" y="608" text-anchor="middle" font-size="13.5" fill="#334155">Nothing here was hand-placed — the model learned these positions from text alone.</text>

  <!-- ============ RIGHT PANEL: analogy ============ -->
  <rect x="820" y="106" width="400" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softS)"/>
  <text x="1020" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Direction carries relationships</text>

  <!-- vertical arrows -->
  <line x1="890" y1="508" x2="890" y2="316" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#sIndigo)"/>
  <line x1="1140" y1="508" x2="1140" y2="316" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#sIndigo)"/>
  <text x="902" y="412" font-size="13" font-weight="600" fill="#4f46e5">+ royalty</text>

  <!-- horizontal arrows -->
  <line x1="902" y1="300" x2="1124" y2="300" stroke="#059669" stroke-width="2.5" marker-end="url(#sGreen)"/>
  <line x1="902" y1="520" x2="1124" y2="520" stroke="#059669" stroke-width="2.5" marker-end="url(#sGreen)"/>
  <text x="1015" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">+ female</text>
  <text x="1015" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">+ female</text>

  <!-- points -->
  <circle cx="890" cy="300" r="9" fill="#0f172a"/><text x="890" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">king</text>
  <circle cx="1140" cy="300" r="9" fill="#0f172a"/><text x="1140" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">queen</text>
  <circle cx="890" cy="520" r="9" fill="#64748b"/><text x="890" y="550" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">man</text>
  <circle cx="1140" cy="520" r="9" fill="#64748b"/><text x="1140" y="550" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">woman</text>

  <text x="1020" y="588" text-anchor="middle" font-size="14" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">king − man + woman ≈ queen</text>
  <text x="1020" y="610" text-anchor="middle" font-size="12.5" fill="#64748b" font-style="italic">The same offset appears in both pairs.</text>

  <!-- footer -->
  <text x="640" y="668" text-anchor="middle" font-size="13.5" fill="#475569">Only <tspan font-weight="700">relative</tspan> position means anything. The axes have no human-readable labels — there is no "dimension 42 = formality".</text>
  <text x="640" y="694" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">Analogy arithmetic works cleanly on word vectors; on sentence embeddings it is a useful intuition more than a reliable operation.</text>
</svg>
