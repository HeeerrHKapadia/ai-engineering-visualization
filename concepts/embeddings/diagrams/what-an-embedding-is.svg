<svg viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="eGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/></marker>
    <marker id="eAmber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d97706"/></marker>
    <filter id="softE" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="0" y="0" width="1280" height="660" fill="#f8fafc"/>

  <text x="640" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">What an embedding actually is</text>
  <text x="640" y="72" text-anchor="middle" font-size="15" fill="#475569">A model turns text into a fixed-length list of numbers that encodes its meaning</text>

  <!-- column headers -->
  <text x="210" y="126" text-anchor="middle" font-size="13" fill="#94a3b8">input text</text>
  <text x="540" y="126" text-anchor="middle" font-size="13" fill="#94a3b8">embedding model</text>
  <text x="970" y="126" text-anchor="middle" font-size="13" fill="#94a3b8">the embedding (a vector)</text>

  <!-- input cards -->
  <rect x="60" y="160" width="300" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#softE)"/>
  <text x="210" y="202" text-anchor="middle" font-size="14.5" fill="#065f46">"The cat sat on the mat"</text>

  <rect x="60" y="268" width="300" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#softE)"/>
  <text x="210" y="310" text-anchor="middle" font-size="14.5" fill="#065f46">"A feline rested on the rug"</text>

  <rect x="60" y="376" width="300" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#softE)"/>
  <text x="210" y="418" text-anchor="middle" font-size="14.5" fill="#92400e">"Quarterly revenue rose 3%"</text>

  <!-- model -->
  <rect x="440" y="160" width="200" height="286" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softE)"/>
  <text x="540" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Embedding</text>
  <text x="540" y="312" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Model</text>
  <text x="540" y="342" text-anchor="middle" font-size="12" fill="#64748b">text-embedding-3</text>
  <text x="540" y="360" text-anchor="middle" font-size="12" fill="#64748b">Voyage · Gemini</text>

  <line x1="360" y1="195" x2="440" y2="195" stroke="#059669" stroke-width="2.5" marker-end="url(#eGreen)"/>
  <line x1="360" y1="303" x2="440" y2="303" stroke="#059669" stroke-width="2.5" marker-end="url(#eGreen)"/>
  <line x1="360" y1="411" x2="440" y2="411" stroke="#d97706" stroke-width="2.5" marker-end="url(#eAmber)"/>

  <line x1="640" y1="195" x2="720" y2="195" stroke="#059669" stroke-width="2.5" marker-end="url(#eGreen)"/>
  <line x1="640" y1="303" x2="720" y2="303" stroke="#059669" stroke-width="2.5" marker-end="url(#eGreen)"/>
  <line x1="640" y1="411" x2="720" y2="411" stroke="#d97706" stroke-width="2.5" marker-end="url(#eAmber)"/>

  <!-- vectors -->
  <rect x="720" y="160" width="500" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#softE)"/>
  <text x="970" y="202" text-anchor="middle" font-size="15" fill="#065f46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[ 0.021  −0.184  0.377  0.052  …  −0.096 ]</text>

  <rect x="720" y="268" width="500" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#softE)"/>
  <text x="970" y="310" text-anchor="middle" font-size="15" fill="#065f46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[ 0.019  −0.176  0.381  0.049  …  −0.102 ]</text>

  <rect x="720" y="376" width="500" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#softE)"/>
  <text x="970" y="418" text-anchor="middle" font-size="15" fill="#92400e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[ −0.412  0.338  −0.045  0.271  …  0.187 ]</text>

  <!-- callouts -->
  <rect x="60" y="486" width="560" height="96" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="84" y="516" font-size="15" font-weight="700" fill="#065f46">Same meaning, different words</text>
  <text x="84" y="542" font-size="13.5" fill="#047857">Rows 1 and 2 share almost no vocabulary — no word except "the"</text>
  <text x="84" y="564" font-size="13.5" fill="#047857">overlaps — yet their vectors land almost on top of each other.</text>

  <rect x="660" y="486" width="560" height="96" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="684" y="516" font-size="15" font-weight="700" fill="#92400e">Different meaning, different direction</text>
  <text x="684" y="542" font-size="13.5" fill="#b45309">Row 3 is about something else entirely, so its vector points a</text>
  <text x="684" y="564" font-size="13.5" fill="#b45309">long way off. That gap is what search actually measures.</text>

  <text x="640" y="616" text-anchor="middle" font-size="13.5" fill="#475569">Every vector from a given model has the same length — commonly 384, 768, 1536 or 3072 numbers.</text>
  <text x="640" y="640" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">The individual numbers mean nothing on their own. Only the distances between vectors carry information.</text>
</svg>
