  <text x="940" y="514" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">Same 40 vectors → 7 comparisons. 10M vectors → a few dozen.</text>
  <rect x="60" y="546" width="560" height="92" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="574" font-size="14.5" font-weight="700" fill="#334155">Always correct, and it does not scale</text>
  <text x="84" y="600" font-size="13" fill="#475569">Guaranteed to return the true nearest neighbours, because it</text>
  <text x="84" y="622" font-size="13" fill="#475569">looked at all of them. Cost grows linearly with your corpus.</text>
  <rect x="660" y="546" width="560" height="92" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="684" y="574" font-size="14.5" font-weight="700" fill="#065f46">Almost always correct, and it does scale</text>
  <text x="684" y="600" font-size="13" fill="#047857">Start sparse and far, hop toward the query, drop a layer, repeat.</text>
  <text x="684" y="622" font-size="13" fill="#047857">Cost grows logarithmically instead of linearly.</text>
  <text x="640" y="668" text-anchor="middle" font-size="13.5" fill="#475569">The trade: ANN can occasionally miss the true #1 match. Recall is tunable — HNSW's <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ef_search</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">M</tspan> dial accuracy up and speed down.</text>
  <text x="640" y="692" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">Rule of thumb: brute force is genuinely fine below roughly 50K vectors. Reach for an ANN index when you outgrow that.</text>
</svg>
