  <text x="340" y="514" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">40 stored vectors → 40 comparisons. 10M vectors → 10M comparisons.</text>
  <rect x="660" y="110" width="560" height="420" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softV)"/>
  <rect x="684" y="132" width="196" height="26" rx="13" fill="#059669"/>
  <text x="782" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">APPROXIMATE NN — HNSW</text>
  <text x="684" y="186" font-size="14.5" font-weight="700" fill="#065f46">Hop down a layered graph, skipping most of it</text>
  <rect x="684" y="214" width="512" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="700" y="236" font-size="12" fill="#94a3b8">Layer 2 — sparse, long hops</text>
