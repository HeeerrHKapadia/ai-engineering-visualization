<svg viewBox="0 0 1240 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="soft6" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="0" y="0" width="1240" height="620" fill="#f8fafc"/>

  <text x="620" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">What a vector database actually does</text>
  <text x="620" y="72" text-anchor="middle" font-size="15" fill="#475569">Not "find this exact value" — "find the k points nearest in meaning"</text>

  <!-- embedding space panel -->
  <rect x="80" y="106" width="1000" height="392" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft6)"/>
  <text x="104" y="136" font-size="13" fill="#94a3b8">embedding space (high-dimensional — flattened to two here)</text>

  <!-- Finance cluster -->
  <ellipse cx="378" cy="290" rx="140" ry="112" fill="#ecfdf5" opacity="0.7"/>
  <text x="300" y="182" font-size="17" font-weight="700" fill="#065f46">Finance chunks</text>

  <!-- nearest-neighbor links, drawn under the points -->
  <line x1="388" y1="242" x2="430" y2="216" stroke="#d97706" stroke-width="3" opacity="0.7"/>
  <line x1="388" y1="242" x2="386" y2="292" stroke="#d97706" stroke-width="3" opacity="0.7"/>
  <line x1="388" y1="242" x2="318" y2="252" stroke="#d97706" stroke-width="3" opacity="0.7"/>

  <circle cx="318" cy="252" r="11" fill="#059669"/>
  <circle cx="430" cy="216" r="11" fill="#059669"/>
  <circle cx="386" cy="292" r="11" fill="#059669"/>
  <circle cx="456" cy="292" r="11" fill="#059669"/>
  <circle cx="306" cy="336" r="11" fill="#059669"/>
  <circle cx="404" cy="366" r="11" fill="#059669"/>

  <!-- query point -->
  <circle cx="388" cy="242" r="15" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>

  <!-- callout -->
  <line x1="406" y1="236" x2="556" y2="216" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text x="568" y="212" font-size="14.5" font-weight="600" fill="#334155">The query vector lands here</text>
  <text x="568" y="234" font-size="13.5" fill="#475569">→ the DB returns its 3 nearest points</text>

  <!-- Animal cluster -->
  <ellipse cx="856" cy="368" rx="128" ry="98" fill="#eef2ff" opacity="0.7"/>
  <text x="784" y="272" font-size="17" font-weight="700" fill="#3730a3">Animal chunks</text>

  <circle cx="880" cy="308" r="11" fill="#6366f1"/>
  <circle cx="812" cy="348" r="11" fill="#6366f1"/>
  <circle cx="906" cy="376" r="11" fill="#6366f1"/>
  <circle cx="790" cy="418" r="11" fill="#6366f1"/>
  <circle cx="866" cy="434" r="11" fill="#6366f1"/>
  <circle cx="940" cy="330" r="11" fill="#6366f1"/>

  <text x="620" y="536" text-anchor="middle" font-size="14.5" fill="#334155">Close together = similar meaning. Search finds nearest neighbors, not exact matches.</text>

  <!-- footnotes -->
  <rect x="80" y="556" width="336" height="44" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="248" y="583" text-anchor="middle" font-size="12.5" fill="#475569">Distance: cosine similarity or dot product</text>

  <rect x="436" y="556" width="368" height="44" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="620" y="583" text-anchor="middle" font-size="12.5" fill="#475569">Speed: approximate nearest neighbor (ANN) — usually HNSW</text>

  <rect x="824" y="556" width="336" height="44" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="992" y="583" text-anchor="middle" font-size="12.5" fill="#475569">Filtering: attach metadata, e.g. date &gt; 2023</text>
</svg>
