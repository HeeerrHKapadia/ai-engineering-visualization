<svg viewBox="0 0 1240 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="aSlate2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="aRed2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="0" y="0" width="1240" height="600" fill="#f8fafc"/>

  <text x="620" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Chunking destroys context</text>
  <text x="620" y="72" text-anchor="middle" font-size="15" fill="#475569">A chunk is true, but stranded — it no longer says what it was about</text>

  <!-- ============ DOCUMENT ============ -->
  <rect x="56" y="112" width="404" height="368" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft2)"/>
  <rect x="56" y="112" width="404" height="52" rx="14" fill="#ecfdf5"/>
  <rect x="56" y="146" width="404" height="18" fill="#ecfdf5"/>
  <text x="80" y="144" font-size="15" font-weight="700" fill="#065f46">SEC filing — ACME Corp, Q2 2023</text>
  <text x="80" y="192" font-size="12.5" fill="#64748b" font-style="italic">The title and surrounding paragraphs carry the context.</text>

  <rect x="80" y="208" width="356" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="98" y="230" font-size="12.5" fill="#334155">"…Q2 2023 results for the fiscal year ending…"</text>
  <text x="98" y="250" font-size="11.5" fill="#94a3b8">chunk 1</text>

  <rect x="80" y="272" width="356" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="98" y="294" font-size="12.5" fill="#334155">"…the previous quarter's revenue was $314M…"</text>
  <text x="98" y="314" font-size="11.5" fill="#94a3b8">chunk 2</text>

  <rect x="80" y="336" width="356" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="98" y="358" font-size="12.5" font-weight="600" fill="#991b1b">"The company's revenue grew by 3% over the</text>
  <text x="98" y="378" font-size="12.5" font-weight="600" fill="#991b1b">previous quarter."</text>

  <rect x="80" y="400" width="356" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="98" y="422" font-size="12.5" fill="#334155">"…operating margin held flat year over year…"</text>
  <text x="98" y="442" font-size="11.5" fill="#94a3b8">chunk 4</text>

  <!-- ============ ARROW ============ -->
  <path d="M 448 362 L 518 362 L 518 228 L 564 228" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#aSlate2)"/>
  <text x="518" y="404" text-anchor="middle" font-size="12.5" fill="#475569">chunk 3 is</text>
  <text x="518" y="423" text-anchor="middle" font-size="12.5" fill="#475569">indexed alone</text>

  <!-- ============ STRANDED CHUNK ============ -->
  <text x="580" y="150" font-size="15" font-weight="700" fill="#0f172a">What the index actually stores</text>

  <rect x="580" y="172" width="504" height="112" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#soft2)"/>
  <text x="604" y="214" font-size="16" font-weight="600" fill="#991b1b">"The company's revenue grew by 3%</text>
  <text x="604" y="242" font-size="16" font-weight="600" fill="#991b1b">over the previous quarter."</text>
  <text x="604" y="268" font-size="12.5" fill="#b91c1c">No document title. No neighbors. No dates.</text>

  <!-- annotations -->
  <path d="M 700 300 L 700 322" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 4" fill="none"/>
  <text x="700" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">which company?</text>
  <path d="M 960 300 L 960 322" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 4" fill="none"/>
  <text x="960" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">which quarter?</text>

  <!-- ============ QUERY ============ -->
  <rect x="580" y="382" width="504" height="98" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" filter="url(#soft2)"/>
  <text x="604" y="414" font-size="13" fill="#475569">Query</text>
  <text x="604" y="444" font-size="17" font-weight="700" fill="#0f172a">"ACME Q2 2023 revenue growth"</text>
  <text x="604" y="466" font-size="12.5" fill="#64748b">Neither index matches — the words and the meaning both went missing.</text>

  <line x1="832" y1="284" x2="832" y2="374" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aRed2)"/>
  <circle cx="1112" cy="431" r="20" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 1104 423 L 1120 439 M 1120 423 L 1104 439" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <text x="1112" y="474" text-anchor="middle" font-size="12.5" font-weight="600" fill="#dc2626">miss</text>

  <text x="620" y="546" text-anchor="middle" font-size="13.5" fill="#475569">The fact is sitting in the knowledge base. Retrieval still fails, because the chunk forgot what it belonged to.</text>
</svg>
