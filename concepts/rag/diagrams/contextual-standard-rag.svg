<svg viewBox="0 0 1240 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="aSlate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="aGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/></marker>
    <marker id="aIndigo" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4f46e5"/></marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="0" y="0" width="1240" height="660" fill="#f8fafc"/>

  <text x="620" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Standard RAG</text>
  <text x="620" y="72" text-anchor="middle" font-size="15" fill="#475569">Two indexes, built once offline — then searched on every query</text>

  <!-- ================= PREPROCESSING ================= -->
  <rect x="48" y="104" width="330" height="30" rx="15" fill="#059669"/>
  <text x="213" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">① PREPROCESSING — offline, runs once</text>

  <!-- Knowledge base -->
  <rect x="48" y="196" width="184" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" filter="url(#soft)"/>
  <text x="140" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Knowledge base</text>
  <text x="140" y="258" text-anchor="middle" font-size="12.5" fill="#475569">docs, filings, code,</text>
  <text x="140" y="277" text-anchor="middle" font-size="12.5" fill="#475569">transcripts …</text>

  <line x1="232" y1="244" x2="266" y2="244" stroke="#64748b" stroke-width="2.5" marker-end="url(#aSlate)"/>

  <!-- Chunking -->
  <rect x="274" y="196" width="184" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" filter="url(#soft)"/>
  <text x="366" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Split into chunks</text>
  <text x="366" y="258" text-anchor="middle" font-size="12.5" fill="#475569">a few hundred tokens</text>
  <text x="366" y="277" text-anchor="middle" font-size="12.5" fill="#475569">each</text>

  <!-- Fork -->
  <path d="M 458 244 L 496 244" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <path d="M 496 244 L 496 178 L 530 178" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#aSlate)"/>
  <path d="M 496 244 L 496 310 L 530 310" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#aSlate)"/>

  <!-- Embedding branch -->
  <rect x="538" y="142" width="206" height="72" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#soft)"/>
  <text x="641" y="172" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">Embedding model</text>
  <text x="641" y="193" text-anchor="middle" font-size="12" fill="#047857">chunk → vector (meaning)</text>

  <line x1="744" y1="178" x2="784" y2="178" stroke="#059669" stroke-width="2.5" marker-end="url(#aGreen)"/>

  <rect x="792" y="142" width="200" height="72" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#soft)"/>
  <text x="892" y="172" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">Vector index</text>
  <text x="892" y="193" text-anchor="middle" font-size="12" fill="#047857">semantic search</text>

  <!-- BM25 branch -->
  <rect x="538" y="274" width="206" height="72" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" filter="url(#soft)"/>
  <text x="641" y="304" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3730a3">BM25 (TF-IDF)</text>
  <text x="641" y="325" text-anchor="middle" font-size="12" fill="#4f46e5">chunk → term statistics</text>

  <line x1="744" y1="310" x2="784" y2="310" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#aIndigo)"/>

  <rect x="792" y="274" width="200" height="72" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" filter="url(#soft)"/>
  <text x="892" y="304" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3730a3">BM25 index</text>
  <text x="892" y="325" text-anchor="middle" font-size="12" fill="#4f46e5">exact word / phrase search</text>

  <!-- Brace note -->
  <path d="M 1010 152 L 1030 152 L 1030 336 L 1010 336" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <text x="1044" y="234" font-size="13" fill="#475569">Every chunk is stored</text>
  <text x="1044" y="254" font-size="13" fill="#475569">twice — once by</text>
  <text x="1044" y="274" font-size="13" fill="#475569">meaning, once by words.</text>

  <!-- Divider -->
  <line x1="48" y1="392" x2="1192" y2="392" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ================= RUNTIME ================= -->
  <rect x="48" y="418" width="300" height="30" rx="15" fill="#4f46e5"/>
  <text x="198" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">② RUNTIME — on every question</text>

  <!-- dashed feed from indexes -->
  <path d="M 892 346 L 892 372 L 596 372 L 596 494" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#aSlate)"/>

  <rect x="48" y="494" width="196" height="88" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" filter="url(#soft)"/>
  <text x="146" y="528" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">User query</text>
  <text x="146" y="551" text-anchor="middle" font-size="12" fill="#475569">a real question</text>

  <line x1="244" y1="538" x2="278" y2="538" stroke="#64748b" stroke-width="2.5" marker-end="url(#aSlate)"/>

  <rect x="286" y="494" width="196" height="88" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" filter="url(#soft)"/>
  <text x="384" y="528" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Embed the query</text>
  <text x="384" y="551" text-anchor="middle" font-size="12" fill="#475569">same vector space</text>

  <line x1="482" y1="538" x2="516" y2="538" stroke="#64748b" stroke-width="2.5" marker-end="url(#aSlate)"/>

  <rect x="524" y="494" width="196" height="88" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#soft)"/>
  <text x="622" y="528" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400e">Search both</text>
  <text x="622" y="551" text-anchor="middle" font-size="12" fill="#b45309">vectors + BM25</text>

  <line x1="720" y1="538" x2="754" y2="538" stroke="#64748b" stroke-width="2.5" marker-end="url(#aSlate)"/>

  <rect x="762" y="494" width="196" height="88" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#soft)"/>
  <text x="860" y="528" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400e">Fuse &amp; de-duplicate</text>
  <text x="860" y="551" text-anchor="middle" font-size="12" fill="#b45309">merge the two lists</text>

  <line x1="958" y1="538" x2="992" y2="538" stroke="#64748b" stroke-width="2.5" marker-end="url(#aSlate)"/>

  <rect x="1000" y="494" width="192" height="88" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#soft)"/>
  <text x="1096" y="528" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e40af">Top-K → LLM</text>
  <text x="1096" y="551" text-anchor="middle" font-size="12" fill="#2563eb">grounded answer</text>

  <text x="620" y="624" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">Embeddings catch paraphrases; BM25 catches exact strings like error codes. Running both covers far more ground than either alone.</text>
</svg>
