<svg viewBox="0 0 1240 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="aSlate4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <filter id="soft4" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="0" y="0" width="1240" height="400" fill="#f8fafc"/>

  <text x="620" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">The query-time pipeline, with reranking</text>
  <text x="620" y="72" text-anchor="middle" font-size="15" fill="#475569">Cast a wide net first, then let a slower, more careful model pick the keepers</text>

  <!-- Query -->
  <rect x="56" y="132" width="232" height="112" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5" filter="url(#soft4)"/>
  <text x="172" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Query</text>
  <text x="172" y="208" text-anchor="middle" font-size="13" fill="#475569">the user's question</text>

  <line x1="288" y1="188" x2="328" y2="188" stroke="#64748b" stroke-width="3" marker-end="url(#aSlate4)"/>

  <!-- Retrieve -->
  <rect x="336" y="132" width="248" height="112" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5" filter="url(#soft4)"/>
  <text x="460" y="176" text-anchor="middle" font-size="19" font-weight="700" fill="#065f46">Retrieve ~150</text>
  <text x="460" y="202" text-anchor="middle" font-size="13" fill="#047857">contextual embeddings</text>
  <text x="460" y="222" text-anchor="middle" font-size="13" fill="#047857">+ contextual BM25</text>

  <line x1="584" y1="188" x2="624" y2="188" stroke="#64748b" stroke-width="3" marker-end="url(#aSlate4)"/>

  <!-- Rerank -->
  <rect x="632" y="132" width="248" height="112" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5" filter="url(#soft4)"/>
  <text x="756" y="176" text-anchor="middle" font-size="19" font-weight="700" fill="#3730a3">Rerank</text>
  <text x="756" y="202" text-anchor="middle" font-size="13" fill="#4f46e5">re-score against the query,</text>
  <text x="756" y="222" text-anchor="middle" font-size="13" fill="#4f46e5">keep the top 20</text>

  <line x1="880" y1="188" x2="920" y2="188" stroke="#64748b" stroke-width="3" marker-end="url(#aSlate4)"/>

  <!-- Generate -->
  <rect x="928" y="132" width="248" height="112" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#soft4)"/>
  <text x="1052" y="176" text-anchor="middle" font-size="19" font-weight="700" fill="#1e40af">Generate</text>
  <text x="1052" y="202" text-anchor="middle" font-size="13" fill="#2563eb">answer, grounded in</text>
  <text x="1052" y="222" text-anchor="middle" font-size="13" fill="#2563eb">the surviving chunks</text>

  <!-- Funnel annotation -->
  <path d="M 460 258 L 460 288 L 756 288 L 756 258" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <text x="608" y="312" text-anchor="middle" font-size="13.5" font-weight="600" fill="#475569">150 candidates in → 20 out</text>
  <text x="608" y="334" text-anchor="middle" font-size="12.5" fill="#64748b">recall first, precision second</text>

  <text x="620" y="374" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">Reranking adds latency and cost, so how wide you cast and how many you keep is a tunable trade-off.</text>
</svg>
