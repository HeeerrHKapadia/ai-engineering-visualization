<svg viewBox="0 0 1360 850" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="mPink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#db2777"/></marker>
    <marker id="mSlate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <filter id="sf" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="0" y="0" width="1360" height="850" fill="#f8fafc"/>

  <!-- Title -->
  <text x="680" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">How RAG Actually Works</text>
  <text x="680" y="68" text-anchor="middle" font-size="15.5" fill="#475569">Two phases — indexing builds the searchable store · retrieval + generation answers the question</text>

  <!-- ===================== INDEXING GROUP ===================== -->
  <rect x="40" y="90" width="388" height="628" rx="16" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <rect x="56" y="104" width="300" height="28" rx="14" fill="#ca8a04"/>
  <text x="206" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">① INDEXING PIPELINE (offline)</text>

  <!-- Data Ingestion -->
  <rect x="92" y="160" width="248" height="64" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#sf)"/>
  <text x="216" y="190" text-anchor="middle" font-size="15.5" font-weight="700" fill="#9a3412">Data Ingestion</text>
  <text x="216" y="210" text-anchor="middle" font-size="11.5" fill="#c2410c">load your raw documents</text>
  <!-- Data Parsing -->
  <rect x="92" y="300" width="248" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#sf)"/>
  <text x="216" y="330" text-anchor="middle" font-size="15.5" font-weight="700" fill="#166534">Data Parsing</text>
  <text x="216" y="350" text-anchor="middle" font-size="11.5" fill="#15803d">clean &amp; split into chunks</text>
  <!-- Embedding -->
  <rect x="92" y="440" width="248" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#sf)"/>
  <text x="216" y="470" text-anchor="middle" font-size="15.5" font-weight="700" fill="#991b1b">Embedding</text>
  <text x="216" y="490" text-anchor="middle" font-size="11.5" fill="#b91c1c">turn each chunk into a vector</text>

  <line x1="216" y1="224" x2="216" y2="298" stroke="#db2777" stroke-width="2.5" marker-end="url(#mPink)"/>
  <line x1="216" y1="364" x2="216" y2="438" stroke="#db2777" stroke-width="2.5" marker-end="url(#mPink)"/>

  <text x="234" y="700" text-anchor="middle" font-size="11.5" font-style="italic" fill="#854d0e">Runs once &amp; on updates — makes your docs searchable.</text>

  <!-- Embedding -> Vectorstore (L path) -->
  <path d="M 216 504 V 712 H 712" fill="none" stroke="#db2777" stroke-width="2.5" marker-end="url(#mPink)"/>
  <text x="520" y="702" text-anchor="middle" font-size="11.5" font-style="italic" fill="#db2777">store indexed vectors</text>

  <!-- ===================== USER QUERY ===================== -->
  <rect x="720" y="150" width="200" height="72" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#sf)"/>
  <text x="820" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">User Query</text>
  <text x="820" y="207" text-anchor="middle" font-size="11.5" fill="#c2410c">the question being asked</text>

  <line x1="820" y1="222" x2="820" y2="554" stroke="#db2777" stroke-width="2.5" marker-end="url(#mPink)"/>
  <text x="838" y="290" font-size="12" font-weight="700" fill="#db2777">① ask</text>

  <!-- ===================== RETRIEVER + VECTORSTORE ===================== -->
  <rect x="720" y="556" width="200" height="204" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#sf)"/>
  <line x1="720" y1="660" x2="920" y2="660" stroke="#2563eb" stroke-width="2"/>
  <text x="820" y="598" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Retriever</text>
  <text x="820" y="618" text-anchor="middle" font-size="11" fill="#2563eb">finds the closest chunks</text>
  <text x="820" y="700" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Vectorstore</text>
  <text x="820" y="720" text-anchor="middle" font-size="11" fill="#2563eb">your vector database</text>

  <!-- vectorstore -> retriever internal -->
  <line x1="878" y1="706" x2="878" y2="636" stroke="#db2777" stroke-width="2.5" marker-end="url(#mPink)"/>
  <text x="928" y="678" font-size="11.5" font-weight="700" fill="#db2777">② search</text>

  <!-- ===================== GENERATION GROUP ===================== -->
  <rect x="980" y="250" width="356" height="470" rx="16" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <rect x="996" y="264" width="320" height="28" rx="14" fill="#9333ea"/>
  <text x="1156" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">② RETRIEVAL + GENERATION (per query)</text>

  <!-- O/P -->
  <rect x="1120" y="320" width="200" height="84" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="2.5" filter="url(#sf)"/>
  <text x="1220" y="360" text-anchor="middle" font-size="20" font-weight="700" fill="#16a34a">O/P</text>
  <text x="1220" y="384" text-anchor="middle" font-size="11.5" fill="#475569">grounded final answer</text>

  <!-- LLM -->
  <rect x="1120" y="556" width="200" height="84" rx="10" fill="#111827" stroke="#6d28d9" stroke-width="2" filter="url(#sf)"/>
  <text x="1220" y="596" text-anchor="middle" font-size="22" font-weight="700" fill="#4ade80">LLM</text>
  <text x="1220" y="620" text-anchor="middle" font-size="11" fill="#a78bfa">reasons over the context</text>

  <!-- Retriever -> LLM (Context) -->
  <line x1="920" y1="598" x2="1118" y2="598" stroke="#db2777" stroke-width="2.5" marker-end="url(#mPink)"/>
  <text x="1020" y="586" text-anchor="middle" font-size="13.5" font-weight="700" fill="#db2777">③ Context</text>
  <text x="1020" y="628" text-anchor="middle" font-size="11" font-style="italic" fill="#7c3aed">Prompt = Context + Query</text>

  <!-- LLM -> O/P -->
  <line x1="1220" y1="556" x2="1220" y2="406" stroke="#db2777" stroke-width="2.5" marker-end="url(#mPink)"/>
  <text x="1240" y="484" font-size="11.5" font-weight="700" fill="#db2777">④ answer</text>

  <!-- ===================== INSIGHT STRIP ===================== -->
  <rect x="40" y="768" width="1296" height="66" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="796" font-size="14" font-weight="700" fill="#3730a3">The key idea</text>
  <text x="60" y="818" font-size="13" fill="#312e81">The LLM only ever sees the chunks the <tspan font-weight="700">Retriever</tspan> pulled from your <tspan font-weight="700">Vectorstore</tspan>. Strong retrieval → grounded, accurate answers. Weak retrieval → the model fills gaps and hallucinates.</text>
</svg>
