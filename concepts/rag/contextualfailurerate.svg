<svg viewBox="0 0 1240 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="1240" height="680" fill="#f8fafc"/>

  <text x="620" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Retrieval failure rate — each technique stacks</text>
  <text x="620" y="72" text-anchor="middle" font-size="15" fill="#475569">Failure = 1 − recall@20: the share of relevant chunks that never make the top 20. Lower is better.</text>

  <!-- gridlines + y labels -->
  <line x1="150" y1="120" x2="1180" y2="120" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="134" y="125" text-anchor="end" font-size="13" fill="#64748b">6%</text>
  <line x1="150" y1="186.7" x2="1180" y2="186.7" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="134" y="191.7" text-anchor="end" font-size="13" fill="#64748b">5%</text>
  <line x1="150" y1="253.3" x2="1180" y2="253.3" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="134" y="258.3" text-anchor="end" font-size="13" fill="#64748b">4%</text>
  <line x1="150" y1="320" x2="1180" y2="320" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="134" y="325" text-anchor="end" font-size="13" fill="#64748b">3%</text>
  <line x1="150" y1="386.7" x2="1180" y2="386.7" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="134" y="391.7" text-anchor="end" font-size="13" fill="#64748b">2%</text>
  <line x1="150" y1="453.3" x2="1180" y2="453.3" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="134" y="458.3" text-anchor="end" font-size="13" fill="#64748b">1%</text>
  <line x1="150" y1="520" x2="1180" y2="520" stroke="#94a3b8" stroke-width="2"/>
  <text x="134" y="525" text-anchor="end" font-size="13" fill="#64748b">0%</text>

  <!-- y axis title -->
  <text transform="translate(56,320) rotate(-90)" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Top-20 retrieval failure rate</text>

  <!-- Bar 1 — baseline 5.7% -->
  <rect x="204" y="140" width="150" height="380" rx="4" fill="#94a3b8"/>
  <text x="279" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">5.7%</text>
  <text x="279" y="552" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Baseline</text>
  <text x="279" y="574" text-anchor="middle" font-size="13" fill="#475569">embeddings + BM25</text>
  <text x="279" y="604" text-anchor="middle" font-size="13" fill="#94a3b8">—</text>

  <!-- Bar 2 — 3.7% -->
  <rect x="461" y="273.3" width="150" height="246.7" rx="4" fill="#6ee7b7"/>
  <text x="536" y="259" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">3.7%</text>
  <text x="536" y="552" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">+ Contextual</text>
  <text x="536" y="574" text-anchor="middle" font-size="13" fill="#475569">embeddings</text>
  <text x="536" y="604" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">35% fewer misses</text>

  <!-- Bar 3 — 2.9% -->
  <rect x="719" y="326.7" width="150" height="193.3" rx="4" fill="#34d399"/>
  <text x="794" y="312" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">2.9%</text>
  <text x="794" y="552" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">+ Contextual</text>
  <text x="794" y="574" text-anchor="middle" font-size="13" fill="#475569">BM25</text>
  <text x="794" y="604" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">49% fewer misses</text>

  <!-- Bar 4 — 1.9% -->
  <rect x="976" y="393.3" width="150" height="126.7" rx="4" fill="#059669"/>
  <text x="1051" y="379" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">1.9%</text>
  <text x="1051" y="552" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">+ Reranking</text>
  <text x="1051" y="574" text-anchor="middle" font-size="13" fill="#475569">top 150 → top 20</text>
  <text x="1051" y="604" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">67% fewer misses</text>

  <text x="620" y="652" text-anchor="middle" font-size="13.5" fill="#64748b" font-style="italic">Best combination measured: strong embeddings (Voyage or Gemini) + contextual BM25 + reranking + top-20 chunks.</text>
</svg>
