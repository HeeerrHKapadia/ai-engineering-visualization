<svg viewBox="0 0 1240 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="soft7" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="0" y="0" width="1240" height="440" fill="#f8fafc"/>

  <text x="620" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Chunk size — a sweet spot with a failure mode on each side</text>
  <text x="620" y="72" text-anchor="middle" font-size="15" fill="#475569">Too little signal on the left, too much dilution on the right</text>

  <!-- Too small -->
  <rect x="60" y="118" width="326" height="164" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" filter="url(#soft7)"/>
  <text x="223" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Too small</text>
  <text x="223" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#dc2626">&lt; ~100 tokens</text>
  <text x="223" y="222" text-anchor="middle" font-size="13.5" fill="#991b1b">A single idea gets split across</text>
  <text x="223" y="243" text-anchor="middle" font-size="13.5" fill="#991b1b">chunks — the embedding has</text>
  <text x="223" y="264" text-anchor="middle" font-size="13.5" fill="#991b1b">too little signal to match on.</text>

  <!-- Sweet spot -->
  <rect x="457" y="118" width="326" height="164" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="3" filter="url(#soft7)"/>
  <text x="620" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Sweet spot</text>
  <text x="620" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#047857">~200–500 tokens</text>
  <text x="620" y="222" text-anchor="middle" font-size="13.5" fill="#065f46">One or two related ideas,</text>
  <text x="620" y="243" text-anchor="middle" font-size="13.5" fill="#065f46">undiluted — coherent enough</text>
  <text x="620" y="264" text-anchor="middle" font-size="13.5" fill="#065f46">to embed, focused enough to hit.</text>

  <!-- Too large -->
  <rect x="854" y="118" width="326" height="164" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" filter="url(#soft7)"/>
  <text x="1017" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Too large</text>
  <text x="1017" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#dc2626">&gt; ~1000 tokens</text>
  <text x="1017" y="222" text-anchor="middle" font-size="13.5" fill="#991b1b">The vector becomes a blurry</text>
  <text x="1017" y="243" text-anchor="middle" font-size="13.5" fill="#991b1b">average of unrelated ideas —</text>
  <text x="1017" y="264" text-anchor="middle" font-size="13.5" fill="#991b1b">and you burn context budget.</text>

  <!-- The three levers -->
  <text x="620" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Three things matter as much as raw size</text>

  <rect x="60" y="346" width="326" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="223" y="370" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">Overlap ~10–20%</text>
  <text x="223" y="391" text-anchor="middle" font-size="12.5" fill="#64748b">so boundary ideas aren't cut in half</text>

  <rect x="457" y="346" width="326" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="620" y="370" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">Cut on natural boundaries</text>
  <text x="620" y="391" text-anchor="middle" font-size="12.5" fill="#64748b">paragraph → sentence → hard token cap</text>

  <rect x="854" y="346" width="326" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1017" y="370" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">Match the content type</text>
  <text x="1017" y="391" text-anchor="middle" font-size="12.5" fill="#64748b">code and tables often stay whole</text>
</svg>
