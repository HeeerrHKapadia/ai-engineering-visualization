<svg viewBox="0 0 1360 940" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="aSlate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="aGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/></marker>
    <marker id="aIndigo" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4f46e5"/></marker>
    <marker id="aPink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c026d3"/></marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="0" y="0" width="1360" height="940" fill="#f8fafc"/>

  <!-- Title -->
  <text x="680" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Retrieval-Augmented Generation (RAG)</text>
  <text x="680" y="72" text-anchor="middle" font-size="16" fill="#475569">The classic ("traditional") RAG architecture — indexing + retrieval</text>

  <!-- WHY box -->
  <rect x="48" y="100" width="380" height="182" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft)"/>
  <text x="70" y="132" font-size="18" font-weight="700" fill="#0f172a">Why RAG?</text>
  <text x="70" y="160" font-size="13.5" fill="#334155">Your knowledge lives in company data —</text>
  <text x="70" y="181" font-size="13.5" fill="#334155">policies, HR docs, finance records.</text>
  <text x="70" y="212" font-size="13.5" fill="#334155">Two ways to give an LLM that knowledge:</text>
  <text x="70" y="238" font-size="13" fill="#334155">• Fine-tune — retrain the model (costly, static)</text>
  <text x="70" y="262" font-size="13" fill="#334155">• RAG — retrieve at query time (cheap, updatable)</text>

  <!-- ================= INDEXING PILL ================= -->
  <rect x="520" y="100" width="334" height="30" rx="15" fill="#059669"/>
  <text x="687" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">① INDEXING — build the knowledge base</text>

  <!-- Ingestion boxes (right -> left) -->
  <!-- Sources -->
  <rect x="1168" y="138" width="166" height="118" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#soft)"/>
  <text x="1251" y="164" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">Data Sources</text>
  <text x="1251" y="192" text-anchor="middle" font-size="13" fill="#065f46">PDF · HTML</text>
  <text x="1251" y="214" text-anchor="middle" font-size="13" fill="#065f46">Excel · CSV</text>
  <text x="1251" y="236" text-anchor="middle" font-size="13" fill="#065f46">SQL Database</text>
  <!-- Parse -->
  <rect x="988" y="150" width="140" height="66" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#soft)"/>
  <text x="1058" y="180" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">Load &amp; Parse</text>
  <text x="1058" y="200" text-anchor="middle" font-size="12" fill="#047857">extract raw text</text>
  <!-- Chunk -->
  <rect x="808" y="150" width="140" height="66" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#soft)"/>
  <text x="878" y="180" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">Chunk</text>
  <text x="878" y="200" text-anchor="middle" font-size="12" fill="#047857">split into pieces</text>
  <!-- Embed -->
  <rect x="604" y="150" width="164" height="66" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#soft)"/>
  <text x="686" y="178" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">Embedding Model</text>
  <text x="686" y="199" text-anchor="middle" font-size="12" fill="#047857">text → vectors (e.g. OpenAI)</text>

  <!-- Ingestion arrows (leftward) -->
  <line x1="1168" y1="183" x2="1132" y2="183" stroke="#059669" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <line x1="988" y1="183" x2="952" y2="183" stroke="#059669" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <line x1="808" y1="183" x2="772" y2="183" stroke="#059669" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <!-- Embed down into DB -->
  <line x1="686" y1="216" x2="686" y2="280" stroke="#059669" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <text x="700" y="252" font-size="12" fill="#059669" font-style="italic">store vectors</text>

  <!-- ================= VECTOR DB ================= -->
  <path d="M 592 302 L 592 462" stroke="#d97706" stroke-width="2.5" fill="none"/>
  <path d="M 780 302 L 780 462" stroke="#d97706" stroke-width="2.5" fill="none"/>
  <ellipse cx="686" cy="462" rx="94" ry="22" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <path d="M 592 302 A 94 22 0 0 0 780 302 L 780 462 A 94 22 0 0 1 592 462 Z" fill="#fffbeb" stroke="none"/>
  <ellipse cx="686" cy="302" rx="94" ry="22" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <path d="M 592 302 L 592 462" stroke="#d97706" stroke-width="2.5"/>
  <path d="M 780 302 L 780 462" stroke="#d97706" stroke-width="2.5"/>
  <path d="M 592 462 A 94 22 0 0 0 780 462" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <text x="686" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#92400e">Vector DB</text>
  <text x="686" y="396" text-anchor="middle" font-size="13.5" fill="#b45309">Knowledge Base</text>
  <text x="686" y="418" text-anchor="middle" font-size="12" fill="#b45309" font-style="italic">easy to refresh / keep updated</text>

  <!-- ================= RETRIEVAL PILL ================= -->
  <rect x="175" y="576" width="410" height="30" rx="15" fill="#4f46e5"/>
  <text x="380" y="596" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">② RETRIEVAL + GENERATION — at query time</text>

  <!-- User -->
  <circle cx="112" cy="628" r="14" fill="none" stroke="#334155" stroke-width="2.5"/>
  <line x1="112" y1="642" x2="112" y2="680" stroke="#334155" stroke-width="2.5"/>
  <line x1="90" y1="656" x2="134" y2="656" stroke="#334155" stroke-width="2.5"/>
  <line x1="112" y1="680" x2="94" y2="706" stroke="#334155" stroke-width="2.5"/>
  <line x1="112" y1="680" x2="130" y2="706" stroke="#334155" stroke-width="2.5"/>
  <text x="112" y="728" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">User</text>
  <line x1="134" y1="656" x2="176" y2="656" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aSlate)"/>

  <!-- Query -->
  <rect x="180" y="624" width="184" height="66" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" filter="url(#soft)"/>
  <text x="272" y="652" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3730a3">User Query</text>
  <text x="272" y="673" text-anchor="middle" font-size="12" fill="#4338ca" font-style="italic">"What is the leave policy?"</text>

  <!-- Embed query -->
  <rect x="404" y="624" width="150" height="66" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" filter="url(#soft)"/>
  <text x="479" y="652" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3730a3">Embed Query</text>
  <text x="479" y="673" text-anchor="middle" font-size="12" fill="#4338ca">text → vector</text>

  <line x1="364" y1="657" x2="404" y2="657" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#aIndigo)"/>

  <!-- Embed query -> DB (similarity search) -->
  <path d="M 554 640 C 620 590 590 500 606 452" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#aIndigo)"/>
  <text x="470" y="548" font-size="12.5" fill="#4f46e5" font-style="italic" font-weight="600">similarity search →</text>

  <!-- DB -> context (top-K) -->
  <path d="M 686 484 C 686 560 700 620 720 636" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#aSlate)"/>
  <text x="700" y="556" font-size="12" fill="#b45309" font-style="italic">retrieve top-K chunks</text>

  <!-- Context + Prompt -->
  <rect x="610" y="640" width="210" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" filter="url(#soft)"/>
  <text x="715" y="672" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3730a3">Prompt</text>
  <text x="715" y="693" text-anchor="middle" font-size="12" fill="#4338ca">retrieved context</text>
  <text x="715" y="710" text-anchor="middle" font-size="12" fill="#4338ca">+ user question</text>

  <!-- LLM -->
  <rect x="866" y="636" width="224" height="88" rx="12" fill="#fae8ff" stroke="#c026d3" stroke-width="2.5" filter="url(#soft)"/>
  <text x="978" y="676" text-anchor="middle" font-size="24" font-weight="700" fill="#86198f">LLM</text>
  <text x="978" y="702" text-anchor="middle" font-size="12.5" fill="#a21caf">generates a grounded answer</text>

  <!-- Output -->
  <rect x="1136" y="640" width="196" height="80" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#soft)"/>
  <text x="1234" y="676" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Answer</text>
  <text x="1234" y="698" text-anchor="middle" font-size="12" fill="#475569">grounded in your data</text>

  <line x1="820" y1="680" x2="866" y2="680" stroke="#c026d3" stroke-width="2.5" marker-end="url(#aPink)"/>
  <line x1="1090" y1="680" x2="1136" y2="680" stroke="#64748b" stroke-width="2.5" marker-end="url(#aSlate)"/>

  <!-- Warning strip -->
  <rect x="48" y="782" width="1284" height="118" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="72" y="818" font-size="16" font-weight="700" fill="#991b1b">⚠ Why grounding matters</text>
  <text x="72" y="846" font-size="13.5" fill="#7f1d1d">If the needed information isn't in the knowledge base — or the retriever fails to fetch it — the LLM falls back on its training data and may</text>
  <text x="72" y="868" font-size="13.5" fill="#7f1d1d"><tspan font-weight="700">hallucinate</tspan>. RAG keeps answers tied to your authoritative, up-to-date data. Better sources + better retrieval = fewer hallucinations.</text>
  <text x="72" y="890" font-size="12" fill="#b91c1c" font-style="italic">Levers to improve quality: chunking strategy · embedding model · similarity search / re-ranking · prompt design.</text>
</svg>
